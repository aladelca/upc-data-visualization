  <text x="385" y="220" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#132238">Criterion</text>
  <text x="935" y="220" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#132238">What strong performance looks like</text>
  <text x="385" y="340" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#132238">Data quality</text>
  <text x="935" y="340" text-anchor="middle" font-family="Arial" font-size="20" fill="#132238">Cleaning is justified, documented, and non-destructive</text>
