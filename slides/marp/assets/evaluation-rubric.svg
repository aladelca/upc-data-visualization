  <text x="935" y="450" text-anchor="middle" font-family="Arial" font-size="20" fill="#132238">Metrics, joins, and logic are consistent with the question</text>
  <text x="385" y="560" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#132238">Visual clarity</text>
  <text x="935" y="560" text-anchor="middle" font-family="Arial" font-size="20" fill="#132238">Encoding and layout guide interpretation with low friction</text>
  <text x="385" y="670" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#132238">Narrative value</text>
  <text x="935" y="670" text-anchor="middle" font-family="Arial" font-size="20" fill="#132238">Insights are defensible, prioritized, and actionable</text>
