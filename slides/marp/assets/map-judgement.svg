<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f7fafc"/>
  <text x="700" y="70" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#132238">Should You Use a Map?</text>
  <rect x="500" y="120" width="400" height="100" rx="20" fill="#132238"/>
  <text x="700" y="180" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#ffffff">Is geography part of the explanation?</text>
  <rect x="180" y="330" width="360" height="140" rx="22" fill="#dcfce7"/>
  <rect x="860" y="330" width="360" height="140" rx="22" fill="#fee2e2"/>
  <text x="360" y="395" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#132238">Yes</text>
  <text x="360" y="430" text-anchor="middle" font-family="Arial" font-size="22" fill="#132238">Use map + supporting chart</text>
  <text x="1040" y="395" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#132238">No</text>
  <text x="1040" y="430" text-anchor="middle" font-family="Arial" font-size="22" fill="#132238">Use bars, heatmaps, tables</text>
  <line x1="600" y1="220" x2="430" y2="330" stroke="#132238" stroke-width="4"/>
  <line x1="800" y1="220" x2="970" y2="330" stroke="#132238" stroke-width="4"/>
  <rect x="280" y="610" width="840" height="110" rx="20" fill="#ffffff" stroke="#d2dae6" stroke-width="4"/>
  <text x="700" y="675" text-anchor="middle" font-family="Arial" font-size="24" fill="#132238">Maps are persuasive but often low precision for ranking and magnitude comparison</text>
</svg>
