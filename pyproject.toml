[project]
name = "data-visualization"
version = "0.1.0"
description = "Materiales y proyectos del curso Data Visualization."
requires-python = ">=3.12"
dependencies = [
  "certifi>=2024.0.0",
  "pandas>=3.0.0",
]

[project.optional-dependencies]
geo = [
  "geopandas>=1.0.0",
  "pyogrio>=0.9.0",
  "shapely>=2.0.0",
]
dev = [
  "mypy>=1.18.0",
  "pytest>=9.0.0",
  "ruff>=0.14.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
